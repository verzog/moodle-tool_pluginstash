name: Moodle Plugin CI

# Run on pull requests, and on pushes to main and tags only. A plain "[push, pull_request]" runs the whole matrix
# twice for every push to a PR branch (once per event).
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    # A plugin-directory review check that phpcs and the test suites do not cover.
    # It needs no Moodle install, so it runs in seconds. (Default role permissions
    # for risky capabilities are checked in the PHPUnit suite.)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Licence text and @license tags match GPL v3 or later
        run: bash .github/scripts/check_licence.sh

  ci:
    uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
