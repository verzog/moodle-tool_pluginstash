name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

env:
  # Behave deterministically for date-sensitive Behat steps (dates render DD/MM/YYYY).
  TZ: Australia/Sydney

jobs:
  test:
    runs-on: ubuntu-24.04

    # Only the 5.3dev (main) matrix entry sets experimental; every stable-branch
    # entry leaves it unset, so this evaluates to false and those jobs stay blocking.
    continue-on-error: ${{ matrix.experimental || false }}

    services:
      postgres:
        # PostgreSQL 17: Moodle 5.3 requires >=17, and 5.0/5.1/5.2 enforce a lower
        # minimum, so 17 satisfies every matrix branch. Only started for pgsql jobs.
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mysql:
        image: ${{ matrix.database == 'mysqli' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # mariadb and mysqli both use port 3306, but only one is ever started per
        # job (the images are gated on matrix.database), so there is no clash.
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
          MARIADB_CHARACTER_SET_SERVER: "utf8mb4"
          MARIADB_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # MOODLE_503_STABLE is not cut yet (5.3 LTS releases ~Oct 2026 and
        # currently lives on main); the non-blocking 5.3dev job below covers it
        # until then, at which point promote it to a blocking entry here.
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_501_STABLE', 'MOODLE_502_STABLE']
        database: ['pgsql', 'mysqli', 'mariadb']
        exclude:
          # Moodle 5.2 dropped PHP 8.2 (requires 8.3+), so these combos are invalid.
          - php: '8.2'
            moodle-branch: 'MOODLE_502_STABLE'
        include:
          # Early-warning job against 5.3dev (the main branch). Allowed to fail
          # via continue-on-error: main is a moving target, so a red here flags
          # upcoming breakage without blocking the PR. Promote to a blocking
          # MOODLE_503_STABLE entry above once that stable branch is cut.
          - php: '8.4'
            moodle-branch: 'main'
            database: 'pgsql'
            experimental: true

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        # Advisory only: phpmd findings are informational and do not block the build.
        continue-on-error: true
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 3

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
